name: Docker Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal de code op
        uses: actions/checkout@v7

      - name: Stel Node.js in
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installeer dependencies
        run: npm ci

      - name: Maak de ZIP
        run: |
          zip -qr "$RUNNER_TEMP/calculator-app.zip" . \
            -x '.git/*' '.github/*' '.env' '.env.*'
          ls -lh "$RUNNER_TEMP/calculator-app.zip"

      - name: Bewaar de ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/calculator-app.zip
          archive: false

      - name: Draai Jest met coverage
        run: npm test -- --ci --runInBand --coverage --coverageReporters=text --coverageReporters=clover --coverageReporters=json-summary

      - name: Bewaar de testrapporten
        uses: actions/upload-artifact@v7
        with:
          name: testresultaten
          path: |
            junit.xml
            coverage/
          if-no-files-found: error

      - name: Toon het rapport in Summary
        if: ${{ !cancelled() && (hashFiles('junit.xml') != '' || hashFiles('coverage/clover.xml') != '') }}
        uses: mridang/action-test-reporter@master
        with:
          results-path: junit.xml
          coverage-path: coverage/clover.xml
          
      - name: Stel Docker Buildx in
        uses: docker/setup-buildx-action@v4

      - name: Log in op Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bouw en publiceer de image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
